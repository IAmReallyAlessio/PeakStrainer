## This is a sample config.ini file for msBinFilter
## used to avoid writing all the configuration lines
## see help for more information regarding the settings

csv = true
#verbose = 2

----
## only one of the filters can be applied
## if no arguments are given, defaults are used

#filterRetentionTime = [ 0.0,  10000.0]
#filterText = [ ms , False]
#filterSamples = 10
----
## only one of the prefilters below can be used 
## if no arguments are given, defaults are used

#prefilter = [2,2,0.5]
#preliminaryReductionFilter = [0.10,10]

----
# bin generation can only use one of the strategies below 

#binsDecimal = 4
#binsResolution = 4
#binsTheoResolution = 4

----
# bin sorting can only use one of the strategies below

#inFirstBin = true
#inWindowBin = 200
#inNarrowBin = true

----
# output file directory
# output_path = /path/to/file/